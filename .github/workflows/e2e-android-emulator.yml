name: Android Emulator Smoke Test

on:
  push:
    branches:
      - test/appium-on-github

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Up Space
        run: |
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build x86_64 APK
        env:
          APP_VARIANT: releaseCandidate
          EXPO_PUBLIC_E2E_TEST: 'true'
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          COMAPEO_METRICS_URL: ${{ vars.COMAPEO_METRICS_URL }}
          COMAPEO_METRICS_API_KEY: ${{ secrets.COMAPEO_METRICS_API_KEY }}
        run: |
          npm run extract-messages
          npm run eas-build-post-install
          npx expo prebuild -p android
          (cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64)
          mv android/app/build/outputs/apk/release/app-release.apk app.apk

      - name: Check the APK's native architectures
        run: |
          unzip -l app.apk | grep -oE 'lib/[^/]+/' | sort | uniq -c
          unzip -l app.apk | grep -q 'lib/x86_64/'

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app.apk

  e2e-tests:
    needs: build-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Each shard boots its own emulator; the groups are balanced by suite duration
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            specs: >-
              --spec tests/e2e/specs/passcode/index.test.ts
              --spec tests/e2e/specs/team/index.test.ts
              --spec tests/e2e/specs/onboarding/index.test.ts
          - shard: 2
            specs: >-
              --spec tests/e2e/specs/observations/index.test.ts
              --spec tests/e2e/specs/multiple-projects/index.test.ts
              --spec tests/e2e/specs/tracks/index.test.ts
          - shard: 3
            specs: >-
              --spec tests/e2e/specs/settings/index.test.ts
              --spec tests/e2e/specs/audio/index.test.ts
              --spec tests/e2e/specs/solo-project/index.tsx
              --spec tests/e2e/specs/menu/index.test.ts
              --spec tests/e2e/specs/exchange/index.test.ts

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # The Appium version BrowserStack runs (wdio.ci.config.js)
      - name: Install Appium
        run: |
          npm install -g appium@2.12.1
          appium driver install uiautomator2@3.10.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Each line of `script` runs as its own shell command.
      # geo fix takes longitude first; this is the location BrowserStack gives the Appium runs.
      - name: Run Appium tests on the emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            adb shell cmd overlay enable com.android.internal.systemui.navbar.threebutton
            adb emu geo fix 78.472225 0.198214
            nohup appium --log appium.log > /dev/null 2>&1 &
            timeout 60 sh -c 'until curl -sf http://127.0.0.1:4723/status > /dev/null; do sleep 1; done'
            mkdir -p test-results
            npx wdio run wdio.emulator.config.js ${{ matrix.specs }} > test-results/spec-log.txt 2>&1; s=$?; cat test-results/spec-log.txt; adb logcat -d > logcat.txt; adb exec-out screencap -p > screen.png; exit $s

      - name: Show crashes
        if: always()
        run: grep -E "FATAL EXCEPTION|UnsatisfiedLinkError|dlopen failed" -A15 logcat.txt | head -80 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results-${{ matrix.shard }}
          path: |
            logcat.txt
            screen.png
            appium.log
            test-results/
