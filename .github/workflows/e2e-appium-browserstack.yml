name: Appium E2E Tests on BrowserStack

on:
  pull_request:
    branches: [main, develop, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    outputs:
      app_url: ${{ steps.upload.outputs.app_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate localization & polyfills for bundling
        run: |
          set -euo pipefail
          npm run build:translations
          npm run build:intl-polyfills
          test -f translations/messages.json
          test -f src/frontend/polyfills/intl.ts

      - name: Debug generated artifacts
        run: |
          ls -la translations
          ls -la src/frontend/polyfills
          head -n 10 src/frontend/polyfills/intl.ts || true

      - name: Verify Expo config resolves
        env:
          APP_VARIANT: releaseCandidate
          EXPO_PUBLIC_E2E_TEST: 'true'
        run: npx expo config --json > /dev/null

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
          expo-cache: true
          eas-cache: true

      - name: Ensure jq (for parsing EAS JSON)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Relax requireCommit for this run (local edit only)
        run: |
          cp eas.json eas.json.bak
          jq '.cli.requireCommit=false' eas.json > eas.tmp.json
          mv eas.tmp.json eas.json
          echo "Patched eas.json:"
          cat eas.json

      - name: Run EAS Workflow (Fingerprint - Repack - Fallback)
        id: eas-wf
        env:
          EAS_ACCESS_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: '1'
          APP_VARIANT: releaseCandidate
          EXPO_PUBLIC_E2E_TEST: 'true'
        run: |
          set -euo pipefail
          OUT=$(eas workflow:run .eas/workflows/e2e-with-repack.yml --non-interactive --wait --json)
          echo "$OUT" | jq -e . >/dev/null

          URL=$(echo "$OUT" | jq -r '(.artifacts.applicationArchiveUrl? // .artifacts.buildUrl? // empty)')

          if [ -z "$URL" ]; then
            URL=$(
              echo "$OUT" | jq -r '
                [
                  (.jobs // [] | .[] | select((.id=="repack" or (.name // "") | test("Repack")) and (.status=="FINISHED"))
                    | (.artifacts.applicationArchiveUrl? // .artifacts.buildUrl?)),
                  (.jobs // [] | .[] | select((.id=="build" or (.name // "") | test("Build")) and (.status=="FINISHED"))
                    | (.artifacts.applicationArchiveUrl? // .artifacts.buildUrl?))
                ]
                | flatten
                | map(select(. != null and . != ""))
                | first // empty
              '
            )
          fi

          if [ -z "$URL" ]; then
            echo "No direct artifact URL in workflow JSON; falling back to latest finished Android 'test' build."
            LIST=$(eas build:list --platform android --status finished --buildProfile test --limit 10 --json)
            URL=$(echo "$LIST" | jq -r '
              (if type=="array" then . else (.items // .builds // .data // []) end)
              | first | .artifacts.buildUrl // empty
            ')
          fi

          if [ -z "$URL" ]; then
            echo "Could not determine APK URL from workflow or fallback."
            echo "Workflow JSON keys:"; echo "$OUT" | jq 'keys' || true
            exit 1
          fi

          echo "app_url=${URL}" >> $GITHUB_OUTPUT

      - name: Download APK
        run: curl -L "${{ steps.eas-wf.outputs.app_url }}" -o app-under-test.apk

      - name: Upload APK to BrowserStack
        id: upload
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          APP_URL=$(curl -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@app-under-test.apk" | jq -r '.app_url')
          echo "app_url=$APP_URL" >> $GITHUB_ENV
          echo "app_url=$APP_URL" >> $GITHUB_OUTPUT

  run-e2e-tests:
    runs-on: ubuntu-latest
    needs: build-apk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set Metadata for Build Context
        run: |
          echo "GITHUB_SHORT_SHA=$(echo ${{ github.event.pull_request.head.sha || github.sha }} | cut -c1-7)" >> $GITHUB_ENV
          echo "GITHUB_PR_TITLE=${{ github.event.pull_request.title || 'Manual Run' }}" >> $GITHUB_ENV

      - name: Run Webdriver IO E2E Tests on BrowserStack
        run: |
          set -o pipefail
          mkdir -p test-results
          npx wdio run wdio.ci.config.js --spec ./tests/e2e/specs/ | tee test-results/spec-log.txt
        env:
          BROWSERSTACK_APP_URL: ${{ needs.build-apk.outputs.app_url }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          GITHUB_SHORT_SHA: ${{ env.GITHUB_SHORT_SHA }}
          GITHUB_PR_TITLE: ${{ env.GITHUB_PR_TITLE }}

      - name: Upload Spec Reporter Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-reporter-logs-${{ github.event.pull_request.number || github.run_number }}
          path: test-results/spec-log.txt
