name: Appium E2E Tests on BrowserStack

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    outputs:
      app_url: ${{ steps.load-or-upload.outputs.app_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine PR Number
        id: pr-number
        run: |
          echo "PR_NUMBER=${GITHUB_HEAD_REF#refs/pull/}" >> $GITHUB_ENV
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Check for Existing APK URL
        id: load-existing
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_name: `apks-${steps.pr-number.outputs.pr_number}`,
                archive_format: 'zip'
              });
              // We don't actually need to download it, just test existence
              return { app_url: 'exists' };
            } catch (error) {
              core.info('No existing APK URL found for this PR.');
              return { app_url: '' };
            }

      - name: Setup EAS (Skip if APK exists)
        if: steps.load-existing.outputs.app_url == ''
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO }}

      - name: Free Up Space (Skip if APK exists)
        if: steps.load-existing.outputs.app_url == ''
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h

      - name: Cache Dependencies
        if: steps.load-existing.outputs.app_url == ''
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
            ~/.gradle/daemon/
            node_modules
          key: dependencies-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            dependencies-cache-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        if: steps.load-existing.outputs.app_url == '' && steps.cache-dependencies.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build and Upload APK to BrowserStack
        id: build-and-upload
        if: steps.load-existing.outputs.app_url == ''
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          EXPO_PUBLIC_E2E_TEST: 'true'
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          COMAPEO_METRICS_URL: ${{ secrets.COMAPEO_METRICS_URL }}
          COMAPEO_METRICS_API_KEY: ${{ secrets.COMAPEO_METRICS_API_KEY }}
        run: |
          npm run extract-messages
          npx expo prebuild -p android
          eas build --platform android --profile test --local

          APK_PATH=$(ls -t build-*.apk | head -n 1)
          echo "Found APK: $APK_PATH"

          APP_URL=$(curl -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@$APK_PATH" | jq -r '.app_url')

          echo "app_url=$APP_URL" >> $GITHUB_ENV
          echo "app_url=$APP_URL" >> $GITHUB_OUTPUT

      - name: Save App URL as Artifact
        if: steps.load-existing.outputs.app_url == '' && steps.build-and-upload.outputs.app_url != ''
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ steps.pr-number.outputs.pr_number }}
          path: |
            ${{ steps.build-and-upload.outputs.app_url }}

      - name: Write App URL to File for Artifact
        if: steps.load-existing.outputs.app_url == '' && steps.build-and-upload.outputs.app_url != ''
        run: |
          echo "${{ steps.build-and-upload.outputs.app_url }}" > app_url.txt

      - name: Load Existing App URL from Artifact
        id: load-or-upload
        if: steps.load-existing.outputs.app_url != ''
        run: |
          echo "Downloading existing APK URL..."
          gh artifact download "apks-${{ steps.pr-number.outputs.pr_number }}" --repo ${{ github.repository }} -p tmp/
          APP_URL=$(cat tmp/app_url.txt)
          echo "app_url=$APP_URL" >> $GITHUB_OUTPUT
          echo "Reusing existing app_url: $APP_URL"

      - name: Fallback Output if No Existing APK
        id: fallback-output
        if: steps.load-existing.outputs.app_url == '' && steps.build-and-upload.outputs.app_url == ''
        run: |
          echo "app_url=" >> $GITHUB_OUTPUT
          echo "No APK built or found."
        # Handle edge case

  run-e2e-tests:
    runs-on: ubuntu-latest
    needs: build-apk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set Metadata for Build Context
        run: |
          echo "GITHUB_SHORT_SHA=$(echo ${{ github.event.pull_request.head.sha || github.sha }} | cut -c1-7)" >> $GITHUB_ENV
          echo "GITHUB_PR_TITLE=${{ github.event.pull_request.title || 'Manual Run' }}" >> $GITHUB_ENV

      - name: Run Webdriver IO E2E Tests on BrowserStack
        run: |
          set -o pipefail
          mkdir -p test-results
          npx wdio run wdio.ci.config.js --spec ./tests/e2e/specs/ | tee test-results/spec-log.txt
        env:
          BROWSERSTACK_APP_URL: ${{ needs.build-apk.outputs.app_url }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          GITHUB_SHORT_SHA: ${{ env.GITHUB_SHORT_SHA }}
          GITHUB_PR_TITLE: ${{ env.GITHUB_PR_TITLE }}

      - name: Upload Spec Reporter Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-reporter-logs-${{ github.event.pull_request.number || github.run_number }}
          path: test-results/spec-log.txt
