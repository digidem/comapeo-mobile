name: Appium E2E Tests on BrowserStack

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    outputs:
      app_url: ${{ steps.upload.outputs.app_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate localization & polyfills for bundling
        run: |
          set -euo pipefail
          npm run extract-messages || true    # only needed if messages/en.json might be missing
          npm run build:translations
          npm run build:intl-polyfills
          test -f translations/messages.json
          test -f src/frontend/polyfills/intl.ts

      - name: Verify Expo config resolves
        env:
          APP_VARIANT: releaseCandidate
          EXPO_PUBLIC_E2E_TEST: 'true'
        run: npx expo config --json > /dev/null

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
          expo-cache: true
          eas-cache: true

      - name: Run EAS Workflow (E2E With Repack)
        env:
          APP_VARIANT: releaseCandidate
          EXPO_PUBLIC_E2E_TEST: 'true'
        run: |
          eas workflow:run .eas/workflows/e2e-with-repack.yml --non-interactive --wait

      - name: Ensure jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Get APK URL from EAS
        id: get-apk-url
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: 2d5b8137-12ec-45aa-9c23-56b6a1c522b7
        run: |
          set -euo pipefail
          COMMIT=${{ github.event.pull_request.head.sha || github.sha }}

          ATTEMPTS=6
          SLEEP=5
          URL=""
          BID=""
          JSON=""

          ROOT_FILTER='(if type=="array" then . else (.items // .builds // .data // []) end)'

          fetch_json() {
            eas build:list \
              --project-id "$EAS_PROJECT_ID" \
              --platform android \
              --status finished \
              --buildProfile test \
              --limit 50 \
              --json
          }

          for i in $(seq 1 $ATTEMPTS); do
            JSON="$(fetch_json)"
            echo "$JSON" | jq -e . >/dev/null || { echo "Non-JSON output from eas build:list"; echo "$JSON"; exit 1; }
            URL=$(echo "$JSON" | jq -r --arg COMMIT "$COMMIT" \
              "try ($ROOT_FILTER | map(select(.gitCommitHash == \$COMMIT)) | first | .artifacts.buildUrl) catch \"\"")
            BID=$(echo "$JSON" | jq -r --arg COMMIT "$COMMIT" \
              "try ($ROOT_FILTER | map(select(.gitCommitHash == \$COMMIT)) | first | .id) catch \"\"")

            if [ -n "$URL" ]; then
              echo "Matched build for commit: $BID"
              break
            fi

            echo "No finished build for commit yet; retrying in ${SLEEP}s... ($i/$ATTEMPTS)"
            sleep $SLEEP
          done

          if [ -z "$URL" ]; then
            URL=$(echo "$JSON" | jq -r "try ($ROOT_FILTER | first | .artifacts.buildUrl) catch \"\"")
            BID=$(echo "$JSON" | jq -r "try ($ROOT_FILTER | first | .id) catch \"\"")
            [ -n "$URL" ] && echo "Using newest finished test build: $BID"
          fi

          if [ -z "$URL" ]; then
            echo "No finished EAS build found (commit or fallback)."
            echo "Recent finished builds payload (first 5):"
            echo "$JSON" | jq "$ROOT_FILTER | .[:5] | map({id, createdAt, profile, platform, status, gitCommitHash, artifact: (.artifacts.buildUrl // null)})"
            exit 1
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
      - name: Download APK
        run: |
          curl -L "${{ steps.get-apk-url.outputs.url }}" -o app-under-test.apk

      - name: Upload APK to BrowserStack
        id: upload
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          APP_URL=$(curl -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@app-under-test.apk" | jq -r '.app_url')
          echo "app_url=$APP_URL" >> $GITHUB_ENV
          echo "app_url=$APP_URL" >> $GITHUB_OUTPUT

  run-e2e-tests:
    runs-on: ubuntu-latest
    needs: build-apk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set Metadata for Build Context
        run: |
          echo "GITHUB_SHORT_SHA=$(echo ${{ github.event.pull_request.head.sha || github.sha }} | cut -c1-7)" >> $GITHUB_ENV
          echo "GITHUB_PR_TITLE=${{ github.event.pull_request.title || 'Manual Run' }}" >> $GITHUB_ENV

      - name: Run Webdriver IO E2E Tests on BrowserStack
        run: |
          set -o pipefail
          mkdir -p test-results
          npx wdio run wdio.ci.config.js --spec ./tests/e2e/specs/ | tee test-results/spec-log.txt
        env:
          BROWSERSTACK_APP_URL: ${{ needs.build-apk.outputs.app_url }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          GITHUB_SHORT_SHA: ${{ env.GITHUB_SHORT_SHA }}
          GITHUB_PR_TITLE: ${{ env.GITHUB_PR_TITLE }}

      - name: Upload Spec Reporter Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-reporter-logs-${{ github.event.pull_request.number || github.run_number }}
          path: test-results/spec-log.txt
