name: Appium E2E Tests on BrowserStack

on:
  pull_request:
    branches: [main, develop, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    outputs:
      app_url: ${{ steps.upload.outputs.app_url }}
      fingerprint: ${{ steps.fingerprint.outputs.hash }}
      cache_hit: ${{ steps.check-cache.outputs.cache-hit }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Fingerprint
        id: fingerprint
        run: |
          npx @expo/fingerprint@latest . \
            --platform android \
            > fingerprint.json
          HASH=$(jq -r '.hash' fingerprint.json)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Native fingerprint: $HASH"
        env:
          APP_VARIANT: releaseCandidate
          EXPO_PUBLIC_E2E_TEST: 'true'

      - name: Check for cached native build
        id: check-cache
        uses: actions/cache@v4
        with:
          path: |
            android-build-cache/app-release.apk
            android-build-cache/fingerprint.txt
          key: native-build-android-${{ steps.fingerprint.outputs.hash }}

      - name: Set up JDK 17
        if: steps.check-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        if: steps.check-cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3

      - name: Build native APK (cache miss)
        if: steps.check-cache.outputs.cache-hit != 'true'
        env:
          APP_VARIANT: releaseCandidate
          EXPO_PUBLIC_E2E_TEST: 'true'
          MAPBOX_DOWNLOAD_TOKEN: ${{ secrets.MAPBOX_DOWNLOAD_TOKEN }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          # Build translations and polyfills
          npm run build:translations
          npm run build:intl-polyfills

          # Build backend
          npm run build:backend

          # Generate native code
          npx expo prebuild --platform android --clean

          # Build APK
          cd android
          ./gradlew assembleRelease
          cd ..

          # Cache the native build
          mkdir -p android-build-cache
          cp android/app/build/outputs/apk/release/app-release.apk android-build-cache/
          echo "${{ steps.fingerprint.outputs.hash }}" > android-build-cache/fingerprint.txt

      - name: Generate localization & polyfills for JS bundle update
        if: steps.check-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          npm run build:translations
          npm run build:intl-polyfills
          test -f translations/messages.json
          test -f src/frontend/polyfills/intl.ts

      - name: Update JS bundle in cached APK
        if: steps.check-cache.outputs.cache-hit == 'true'
        env:
          APP_VARIANT: releaseCandidate
          EXPO_PUBLIC_E2E_TEST: 'true'
        run: |
          set -euo pipefail

          # Install apktool if not present
          if ! command -v apktool &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y apktool
          fi

          # Export JS bundle
          npx expo export --platform android --output-dir ./bundle-output

          # Unpack the cached APK
          apktool d android-build-cache/app-release.apk -o apk-unpacked

          # Replace the JS bundle
          cp -r bundle-output/* apk-unpacked/assets/

          # Repack the APK
          apktool b apk-unpacked -o app-repacked-unsigned.apk

          # Sign the APK (debug keystore for testing)
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android \
            -keypass android -dname "CN=Android Debug,O=Android,C=US"

          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore debug.keystore -storepass android -keypass android \
            app-repacked-unsigned.apk androiddebugkey

          # Zipalign the APK
          ${ANDROID_HOME}/build-tools/*/zipalign -v 4 app-repacked-unsigned.apk app-under-test.apk

      - name: Copy APK from cache
        if: steps.check-cache.outputs.cache-hit != 'true'
        run: |
          cp android-build-cache/app-release.apk app-under-test.apk

      - name: Upload APK to BrowserStack
        id: upload
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          APP_URL=$(curl -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@app-under-test.apk" | jq -r '.app_url')
          echo "app_url=$APP_URL" >> $GITHUB_ENV
          echo "app_url=$APP_URL" >> $GITHUB_OUTPUT

  run-e2e-tests:
    runs-on: ubuntu-latest
    needs: build-apk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set Metadata for Build Context
        run: |
          echo "GITHUB_SHORT_SHA=$(echo ${{ github.event.pull_request.head.sha || github.sha }} | cut -c1-7)" >> $GITHUB_ENV
          echo "GITHUB_PR_TITLE=${{ github.event.pull_request.title || 'Manual Run' }}" >> $GITHUB_ENV

      - name: Run Webdriver IO E2E Tests on BrowserStack
        run: |
          set -o pipefail
          mkdir -p test-results
          npx wdio run wdio.ci.config.js --spec ./tests/e2e/specs/ | tee test-results/spec-log.txt
        env:
          BROWSERSTACK_APP_URL: ${{ needs.build-apk.outputs.app_url }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          GITHUB_SHORT_SHA: ${{ env.GITHUB_SHORT_SHA }}
          GITHUB_PR_TITLE: ${{ env.GITHUB_PR_TITLE }}

      - name: Upload Spec Reporter Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-reporter-logs-${{ github.event.pull_request.number || github.run_number }}
          path: test-results/spec-log.txt
