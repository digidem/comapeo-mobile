appId: com.comapeo.rc
name: Create a project from the menu
---
- runFlow: helpers/onboarding.yaml
- tapOn: Open Menu
- tapOn: Collaborate
- tapOn: Start New Project
- tapOn: Next
- tapOn:
    id: PROJECT.name-inp
- inputText: second project
- hideKeyboard
- tapOn:
    id: PROJECT.create-btn
- assertVisible: .*Share Project Statistics.*
- tapOn: .*No, Skip for Now.*
- assertVisible: .*second project.*
- assertVisible: Invite a Device
- tapOn: .*Done.*
- assertVisible: second project
- assertVisible: Coordinator
