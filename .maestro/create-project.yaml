appId: ${APP_ID || "com.comapeo.rc"}
name: Create a project from the menu
---
- runFlow: helpers/onboarding.yaml
- tapOn: Open Menu
- tapOn: Collaborate
- runFlow:
    file: helpers/new-project.yaml
    env:
      PROJECT_NAME: second project
- tapOn: Close drawer
- assertVisible:
    id: HOME.header-title
- assertVisible: second project
