appId: com.comapeo.rc
name: COMAPEO-2J8 - import a background map while the map screen stays mounted
---
- tapOn: "Open Menu"
- tapOn: "Go to background maps screen."
- tapOn: "Choose File|Elegir archivo"
# The system picker may open on "Recent"; switch to Downloads if needed.
- runFlow:
    when: { notVisible: "demotiles.smp" }
    commands:
      - tapOn: "Show roots"
      - tapOn: "Downloads|Descargas"
- tapOn: "demotiles.smp"
- extendedWaitUntil:
    visible: "Close|Cerrar"
    timeout: 60000
- tapOn: "Close|Cerrar"
- tapOn: "Home, back"
- back
