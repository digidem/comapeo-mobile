appId: com.comapeo.rc
name: COMAPEO-2J8 - fresh install to map screen
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil:
    visible: { id: "SET_QA_DEVICE_NAME.name-input" }
    timeout: 60000
- tapOn: { id: "SET_QA_DEVICE_NAME.name-input" }
- inputText: "repro-2j8"
- hideKeyboard
- tapOn: { id: "SET_QA_DEVICE_NAME.save-btn" }
- tapOn: { id: "ONBOARDING.navigate-to-privacy-policy-btn" }
- tapOn: "Next|Siguiente"
- tapOn: { id: "ONBOARDING.device-name-inp" }
- inputText: "repro"
- hideKeyboard
- tapOn: { id: "ONBOARDING.add-name-btn" }
- tapOn: { id: "ONBOARDING.navigate-to-map-btn" }
# A cold emulator sometimes hits an RPC timeout here; a relaunch recovers.
- extendedWaitUntil:
    visible: { id: "MAIN.mapbox-map-view" }
    timeout: 40000
    optional: true
- runFlow:
    when: { visible: "Something went wrong|Algo salió mal" }
    commands:
      - stopApp
      - launchApp
- extendedWaitUntil:
    visible: { id: "MAIN.mapbox-map-view" }
    timeout: 60000
